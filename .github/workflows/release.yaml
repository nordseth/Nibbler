name: Create release

on:
  push:
    tags:
      - 'v*'
  # build and verify the binaries (no release, no upload) when the release build changes
  pull_request:
    paths:
      - '.github/workflows/release.yaml'
      - 'tests/verify-release-binary.*'
      - 'Nibbler.Aot/**'

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} -d --generate-notes
      - name: set version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "version=${REF:1}" >> $GITHUB_OUTPUT

  nuget:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: create nuget
        run: dotnet pack Nibbler -o ./publish
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload ${{ github.ref_name }} ./publish/Nibbler.$VERSION.nupkg --clobber

  linux:
    needs: create-release
    # create-release is skipped on pull requests; still build and verify then
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # every target builds natively on its own architecture, so its binary can be run
          # and verified on the same runner. musl targets build and verify in Alpine.
          - runtime: linux-x64
            os: ubuntu-24.04
            libc: glibc
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
            libc: glibc
          - runtime: linux-musl-x64
            os: ubuntu-24.04
            libc: musl
          - runtime: linux-musl-arm64
            os: ubuntu-24.04-arm
            libc: musl
    env:
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tags to compute the version
      - name: Setup .NET Core
        if: matrix.libc == 'glibc'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: create aot exe (glibc)
        if: matrix.libc == 'glibc'
        run: dotnet publish Nibbler.Aot -c Release -f net11.0 -r $RUNTIME -o tmp/
      - name: create aot exe (musl, in Alpine)
        if: matrix.libc == 'musl'
        # building on the glibc runner links the binary against glibc, so it doesn't start on
        # Alpine. Build inside the Alpine SDK image instead.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e RUNTIME -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            mcr.microsoft.com/dotnet/sdk:11.0-alpine3.24 \
            sh -c 'git config --global --add safe.directory /src &&
                   apk add --no-cache clang build-base zlib-dev &&
                   dotnet publish Nibbler.Aot -c Release -f net11.0 -r $RUNTIME -o tmp/ &&
                   chown -R $HOST_UID:$HOST_GID tmp'
      - name: rename binary
        run: |
          rm -f tmp/Nibbler
          mv tmp/Nibbler.Aot tmp/nibbler
      - name: verify binary
        # run the binary in a clean container of its libc, without .NET installed
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then IMAGE=alpine:3.24; else IMAGE=ubuntu:24.04; fi
          docker run --rm -v "$PWD:/src:ro" $IMAGE \
            sh /src/tests/verify-release-binary.sh /src/tmp/nibbler "$VERSION"
      - name: create tar
        run: |
          tar -czvf Nibbler.${VERSION}_${RUNTIME}.tar.gz \
              --mode='a+x' --owner=0 \
              -C tmp/ nibbler
      - name: upload
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} Nibbler.${VERSION}_${RUNTIME}.tar.gz --clobber

  windows:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tags to compute the version
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: create aot exe
        run: dotnet publish Nibbler.Aot -c Release -f net11.0 -r win-x64 -o tmp\
      - name: rename binary
        run: |
          Remove-Item tmp\Nibbler.exe -ErrorAction SilentlyContinue
          move tmp\Nibbler.Aot.exe nibbler.exe
      - name: verify binary
        run: ./tests/verify-release-binary.ps1 -Nibbler ./nibbler.exe -Version "$Env:VERSION"
      - name: create zip
        run: 7z a Nibbler.${Env:VERSION}_win-x64.zip nibbler.exe
      - name: upload
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} Nibbler.${Env:VERSION}_win-x64.zip --clobber
